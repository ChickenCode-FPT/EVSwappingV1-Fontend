<div class="dashboard-container">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <section class="stats">
      <div class="card" *ngFor="let item of stats" [style.borderTopColor]="item.color">
        <span class="icon">{{ item.icon }}</span>
        <div>
          <h3>{{ item.value }}</h3>
          <p>{{ item.title }}</p>
        </div>
      </div>
    </section>
  </main>
</div>
