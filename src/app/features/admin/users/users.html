<div class="users-container">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <header class="header">
      <h1>Admin - Users Management</h1>
    </header>

    <div *ngIf="loading" class="spinner-container">
      <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>

    <div *ngIf="!loading && users.length > 0">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

        <!-- Email Column -->
           <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
          <td mat-cell *matCellDef="let user"> {{user.email}} </td>
        </ng-container>
        <!-- Full Name Column -->
        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Full Name </th>
          <td mat-cell *matCellDef="let user"> {{user.fullName}} </td>
        </ng-container>

        <!-- Phone Column -->
        <ng-container matColumnDef="phoneNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Phone </th>
          <td mat-cell *matCellDef="let user"> {{user.phoneNumber}} </td>
        </ng-container>

        <!-- Roles Column -->
        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef> Roles </th>
          <td mat-cell *matCellDef="let user">
            <span *ngFor="let role of user.roles" matBadge="{{role}}" matBadgeColor="primary" matBadgeOverlap="false"></span>
          </td>
        </ng-container>
        <!-- Lockout Column -->
<ng-container matColumnDef="lockout">
  <th mat-header-cell *matHeaderCellDef> Locked </th>
  <td mat-cell *matCellDef="let user">
    <span [ngClass]="{'locked': user.lockout, 'unlocked': !user.lockout}">
      {{ user.lockout ? 'Yes' : 'No' }}
    </span>
  <button class="lock-btn" *ngIf="!user.lockout" (click)="lockUser(user.id)">Lock</button>
  <button class="unlock-btn" *ngIf="user.lockout" (click)="unlockUser(user.id)">Unlock</button>
  </td>
</ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>

    <div *ngIf="!loading && users.length === 0">No users found.</div>
    
  </main>
</div>
