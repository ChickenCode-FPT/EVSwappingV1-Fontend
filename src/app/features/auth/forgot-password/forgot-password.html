<div class="auth-container">
  <h2>Quên mật khẩu</h2>

  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
    <div>
      <label>Email</label>
      <input type="email" formControlName="email" />
      <small *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid">
        Email không hợp lệ
      </small>
    </div>

    <button type="submit" [disabled]="forgotForm.invalid">Gửi link reset</button>
  </form>

  <p *ngIf="message">{{ message }}</p>
</div>
