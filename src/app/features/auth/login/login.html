<div class="auth-container">
  <h2>Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div>
      <label>Email</label>
      <input type="email" formControlName="email" />
      <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        Email không hợp lệ
      </small>
    </div>

    <div>
      <label>Password</label>
      <input type="password" formControlName="password" />
      <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        Password không được để trống
      </small>
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Login</button>

    
   
    <div class="social-login">
      <button type="button" class="google-btn" (click)="loginWithGoogle()">
        <img src="assets/google-icon.png" alt="Google" />
        Login with Google
      </button>
    </div>
  </form>
   <div class="auth-links">
      <a routerLink="/forgot-password">Quên mật khẩu?</a>
    </div>

</div>
