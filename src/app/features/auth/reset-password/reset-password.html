<div class="auth-container">
  <h2>Đặt lại mật khẩu</h2>

  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
    <div>
      <label>Mật khẩu mới</label>
      <input type="password" formControlName="password" />
      <small *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid">
        Mật khẩu phải ít nhất 6 ký tự
      </small>
    </div>

    <div>
      <label>Xác nhận mật khẩu</label>
      <input type="password" formControlName="confirmPassword" />
      <small *ngIf="resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched">
        Mật khẩu không khớp
      </small>
    </div>

    <button type="submit" [disabled]="resetForm.invalid">Đặt lại mật khẩu</button>
  </form>

  <p *ngIf="message">{{ message }}</p>
</div>
