<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-indigo-50 to-teal-50 p-4">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
    <h2 class="text-3xl font-extrabold text-gray-900 mb-6 text-center">
        Face Verification
    </h2>

    <div class="relative w-full pb-[56.25%] rounded-lg overflow-hidden border-4 border-gray-300 shadow-inner">
      <video #video autoplay playsinline muted
             class="absolute top-0 left-0 w-full h-full object-cover rounded-lg bg-black"></video>
    </div>

    <div class="mt-6 text-center">
      <p class="text-lg font-medium text-gray-700">Status:</p>
      <p class="mt-2 text-2xl font-bold transition-colors duration-300"
         [ngClass]="match ? 'text-green-600' : 'text-red-600'">
        {{ resultText }}
      </p>
    </div>

    <div class="mt-8 text-center text-sm text-gray-500">
      Face will be detected automatically. Please look at the camera steadily.
    </div>
  </div>
</div>
@if (showSuccessPopup) {
  <div
    class="fixed inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm z-50"
  >
    <div class="bg-white rounded-2xl p-8 shadow-xl w-80 text-center animate-fadeIn">
      <h3 class="text-2xl font-bold text-green-600 mb-4">Verification Successful</h3>
      
      <p class="text-gray-700">Employee face has been verified.</p>
  
      <button
        (click)="closeSuccessPopup()"
        class="mt-6 w-full py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold shadow"
      >
        Continue
      </button>
    </div>
  </div>
}
