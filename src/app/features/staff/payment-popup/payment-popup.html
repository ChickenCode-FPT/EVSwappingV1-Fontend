<div *ngIf="visible" class="fixed inset-0 flex justify-center items-center z-50 bg-white/30 backdrop-blur-sm">
    <div class="bg-white p-6 rounded-2xl shadow-2xl w-[400px] border border-gray-200">
        <h2 class="text-xl font-semibold mb-4 text-center text-gray-800">Update Payment</h2>

        <div class="space-y-3">
            <!-- Amount -->
            <label class="block">
                <span class="text-gray-700 font-medium">Amount</span>
                <input type="number" step="any" [(ngModel)]="editablePayment.amount" readonly
                    class="w-full border border-gray-300 rounded-lg p-2 mt-1" />
            </label>

            <!-- Method -->
            <label class="block">
                <span class="text-gray-700 font-medium">Method</span>
                <select [(ngModel)]="editablePayment.method" class="w-full border border-gray-300 rounded-lg p-2 mt-1">
                    <option value="Cash">Cash</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="E-Wallet">E-Wallet</option>
                </select>
            </label>

            <!-- Status -->
            <label class="block">
                <span class="text-gray-700 font-medium">Status</span>
                <select [(ngModel)]="editablePayment.status" class="w-full border border-gray-300 rounded-lg p-2 mt-1">
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                    <option value="Failed">Failed</option>
                </select>
            </label>

            <!-- Currency (read-only) -->
            <label class="block">
                <span class="text-gray-700 font-medium">Currency</span>
                <input type="text" [(ngModel)]="editablePayment.currency" readonly
                    class="w-full border border-gray-200 bg-gray-100 rounded-lg p-2 mt-1 text-gray-500 cursor-not-allowed" />
            </label>

            <input type="hidden" [(ngModel)]="editablePayment.paidAt" />
            <input type="hidden" [(ngModel)]="editablePayment.createdAt" />
        </div>

        <div class="flex justify-end space-x-3 mt-6">
            <button (click)="cancel()"
                class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition">
                Cancel
            </button>
            <button (click)="updatePayment()"
                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                Save
            </button>
        </div>
    </div>
</div>
