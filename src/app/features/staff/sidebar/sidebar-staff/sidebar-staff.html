<div class="flex flex-col h-screen w-64 bg-gray-900 shadow-2xl fixed top-0 left-0 z-20">
      
      <!-- App Title/Header -->
      <div class="px-4 py-6 border-b border-gray-700">
        <h3 class="text-xl font-extrabold text-indigo-400 tracking-wider">
          <i class="material-symbols-outlined text-2xl align-middle mr-2 font-light">bolt</i> 
          EVSwap Staff
        </h3>
      </div>

      <!-- Navigation List -->
      <nav class="flex-grow p-2 space-y-1 overflow-y-auto">
        <!-- Using @for for clean iteration -->
        @for (item of menuItems; track item.path) {
          <!-- Menu Item Link -->
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-indigo-700/50 text-white font-semibold shadow-inner"
            class="flex items-center space-x-3 p-3 text-gray-300 rounded-lg transition duration-150 ease-in-out 
                   hover:bg-indigo-600/70 hover:text-white group"
            [attr.aria-label]="item.label"
          >
            <!-- Material Symbols Icon -->
            <i class="material-symbols-outlined text-xl text-gray-400 group-[.routerLinkActive]:text-white transition-colors">
              {{ item.icon }}
            </i>
            <span class="text-sm">
              {{ item.label }}
            </span>
          </a>
        }
      </nav>

      <!-- Logout Section -->
      <div class="p-4 border-t border-gray-700">
        <button 
          (click)="logout()"
          class="w-full flex items-center justify-center space-x-3 p-3 bg-red-600 text-white font-medium rounded-lg 
                 shadow-lg transition duration-150 ease-in-out 
                 hover:bg-red-700 hover:shadow-xl active:scale-[0.98] transform focus:outline-none focus:ring-4 focus:ring-red-500/50"
          aria-label="Logout"
        >
          <i class="material-symbols-outlined text-xl">logout</i>
          <span>Logout</span>
        </button>
      </div>
    </div>
