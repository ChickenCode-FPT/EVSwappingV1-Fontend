<!-- src\app\features\vehicle\pages\vehicle-add\vehicle-add.component.html -->
<section class="page">
  <div class="card">

    <h2>Liên kết phương tiện</h2>
    <p class="subtitle">Nhập thông tin xe để sử dụng dịch vụ đổi pin.</p>

    <div class="form-group">
      <label>VIN *</label>
      <input [(ngModel)]="form.vin" />
    </div>

    <div class="form-group">
      <label>Hãng xe *</label>
      <input [(ngModel)]="form.make" />
    </div>

    <div class="form-group">
      <label>Dòng xe *</label>
      <input [(ngModel)]="form.model" />
    </div>

    <div class="form-group">
      <label>Năm sản xuất *</label>
      <input type="number" [(ngModel)]="form.year" />
    </div>

    <div class="form-group">
      <label>Model pin *</label>
      <select [(ngModel)]="form.batteryModelPreferenceId">
        <option disabled value="">-- Chọn model pin --</option>
        <option *ngFor="let b of batteryModels" [value]="b.batteryModelId">
          {{ b.modelCode }} - {{ b.capacityKwh }} kWh
        </option>
      </select>
    </div>

    <button class="primary-btn" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Đang lưu...' : 'Thêm phương tiện' }}
    </button>

    <div class="alert success" *ngIf="success">✔ Đã thêm xe thành công!</div>
    <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>

  </div>
</section>
