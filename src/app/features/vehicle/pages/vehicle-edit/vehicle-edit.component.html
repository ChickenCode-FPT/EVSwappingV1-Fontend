<!-- src\app\features\vehicle\pages\vehicle-edit\vehicle-edit.component.html -->
<section class="page">
  <div class="card">

    <div class="header-row">
      <h2>Chỉnh sửa phương tiện</h2>
      <button class="back-btn" (click)="back()">
        <span class="material-icons">arrow_back</span> Trở lại
      </button>
    </div>

    <p class="subtitle">Cập nhật thông tin xe đã liên kết.</p>

    <div *ngIf="loading" class="loading">Đang tải dữ liệu...</div>

    <div *ngIf="!loading">

      <div class="form-group">
        <label>VIN *</label>
        <input [(ngModel)]="form.vin" />
      </div>

      <div class="form-group">
        <label>Hãng xe *</label>
        <input [(ngModel)]="form.make" />
      </div>

      <div class="form-group">
        <label>Dòng xe *</label>
        <input [(ngModel)]="form.model" />
      </div>

      <div class="form-group">
        <label>Năm sản xuất *</label>
        <input type="number" [(ngModel)]="form.year" />
      </div>

      <div class="form-group">
        <label>Model pin *</label>
        <select [(ngModel)]="form.batteryModelPreferenceId">
          <option disabled value="">-- Chọn model pin --</option>
          <option *ngFor="let b of batteryModels" [value]="b.batteryModelId">
            {{ b.modelCode }} - {{ b.capacityKwh }} kWh
          </option>
        </select>
      </div>

      <button class="primary-btn" (click)="submit()" [disabled]="saving">
        {{ saving ? 'Đang lưu...' : 'Cập nhật xe' }}
      </button>

      <div class="alert success" *ngIf="success">✔ Cập nhật thành công!</div>
      <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>

    </div>

  </div>
</section>
