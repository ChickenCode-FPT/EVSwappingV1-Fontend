<section class="page">
  <div class="card">

    <div class="header-row">
      <h2>Chỉnh sửa phương tiện</h2>
      <button class="back-btn" (click)="back()">
        <span class="material-icons">arrow_back</span>
        Trở lại
      </button>
    </div>

    <div *ngIf="loading" class="loading">Đang tải dữ liệu...</div>

    <div *ngIf="!loading">
      <p class="subtitle">Cập nhật thông tin xe đã liên kết.</p>

      <label>VIN</label>
      <input [(ngModel)]="form.vin" placeholder="VD: 1HGCM82633A123456" />

      <label>Hãng xe</label>
      <input [(ngModel)]="form.make" placeholder="VD: VinFast" />

      <label>Dòng xe</label>
      <input [(ngModel)]="form.model" placeholder="VD: Klara S" />

      <label>Năm sản xuất</label>
      <input type="number" [(ngModel)]="form.year" placeholder="VD: 2023" />

      <label>Model pin (ID)</label>
      <input type="number" [(ngModel)]="form.batteryModelPreferenceId" placeholder="VD: 1" />

      <button class="primary-btn" (click)="submit()" [disabled]="saving">
        {{ saving ? 'Đang lưu...' : 'Cập nhật xe' }}
      </button>

      <div class="alert success" *ngIf="success">✔ Cập nhật thành công!</div>
      <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>
    </div>

  </div>
</section>
