<header class="header">
  <div class="logo">
    <img src="assets/finallogo.png" alt="Logo" class="logo-image" />
  </div>

  <nav class="nav">
    <ul class="header-features">
      <li><a routerLink="/home">Home</a></li>
      <li><a routerLink="/about">About</a></li>

      <ng-container *ngIf="isCustomer()">
        <li><a routerLink="/station">Stations</a></li>
        <li><a routerLink="/reservations">Reservations</a></li>
      </ng-container>

      <li><a routerLink="/contact">Contact</a></li>

      <ng-container *ngIf="!authService.isLoggedIn(); else loggedIn">
        <li><a routerLink="/login">Login</a></li>
        <li><a routerLink="/register">Register</a></li>
      </ng-container>

      <ng-template #loggedIn>
        <li class="user-dropdown">
          <a href="javascript:void(0)">Hello {{ authService.getFullname() }}</a>
          <ul class="dropdown-menu">
            <li><a routerLink="/profile">Profile</a></li>

            <li *ngIf="isAdmin()"><a routerLink="/admin/dashboard">Admin Dashboard</a></li>
            <li *ngIf="isStaff()"><a routerLink="/staff">Staff Dashboard</a></li>
            <li *ngIf="isCustomer()"><a routerLink="/home">Customer Dashboard</a></li>

            <li><a routerLink="/2fa-setup">Enable 2 Factor</a></li>
            <li><a routerLink="/disable-2fa">Disable 2 Factor</a></li>
            <li><a (click)="logout()">Logout</a></li>
          </ul>
        </li>
      </ng-template>
    </ul>
  </nav>
</header>
